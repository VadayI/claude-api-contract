name: Contract exact audit
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      base:
        description: Exact ancestor commit for manual audit
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Exact contract audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install pinned oasdiff prerequisite
        run: |
          go install github.com/oasdiff/oasdiff@v1.18.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run scheduled exact-candidate catalog
        env:
          CI_CANDIDATE: ${{ github.sha }}
          CI_MANUAL_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base="$CI_MANUAL_BASE"
          if [ -z "$base" ]; then base="$(git rev-parse "${CI_CANDIDATE}^" 2>/dev/null)"; fi
          python scripts/ai/runner.py --repository . --candidate "$CI_CANDIDATE" --base "$base" --event schedule --network allowed --catalog templates/ai/checks/contract.json --output .ai-runtime/results/contract-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-audit-result
          path: .ai-runtime/results/contract-audit.json
          if-no-files-found: warn
